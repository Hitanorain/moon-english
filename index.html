<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="熊猫英语">
<meta name="theme-color" content="#ffffff">
<meta name="referrer" content="no-referrer">
<title>熊猫英语 · 看图听音</title>
<style>
:root{
  color-scheme:light;
  --green:#58cc02;--green-d:#58a700;--green-bg:#d7ffb8;
  --red:#ff4b4b;--red-d:#ea2b2b;--red-bg:#ffdfe0;
  --blue:#1cb0f6;--blue-d:#1899d6;--blue-bg:#ddf4ff;
  --ink:#3c3c3c;--muted:#777;--faint:#afafaf;--line:#e5e5e5;--soft:#f7f7f7;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.on{display:flex;flex-direction:column}
.pic{font-family:var(--emoji);line-height:1.15;text-align:center;display:inline-block;word-break:break-all}

/* ---------- 首页 ---------- */
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--line);
  padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--green);margin-right:auto}
.logo .pic{font-size:30px}
.chip{display:flex;align-items:center;gap:4px;font-weight:800;font-size:17px;padding:6px 8px;border-radius:12px}
.chip.fire{color:#ff9600}.chip.fire.off{color:var(--faint);filter:grayscale(1)}
.chip.xp{color:#e5a800}
.icon-btn{border:0;background:none;padding:6px;border-radius:12px;display:flex}
.icon-btn:active{background:var(--soft)}
.icon-btn svg{width:28px;height:28px;stroke:var(--faint);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.path{width:100%;max-width:560px;margin:0 auto;padding:8px 16px 140px}
.lvl{border-radius:18px;color:#fff;background:var(--c);box-shadow:0 5px 0 var(--cd);padding:16px 18px 14px;margin:30px 0 4px}
.lvh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lvh small{display:block;font-weight:800;opacity:.85;font-size:14px;letter-spacing:.5px}
.lvh b{font-size:21px}
.lvh span{font-weight:800;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:10px;font-size:14px;white-space:nowrap}
.lvbar{height:8px;background:rgba(0,0,0,.15);border-radius:4px;margin-top:10px;overflow:hidden}
.lvbar i{display:block;height:100%;background:#fff;border-radius:4px}
.ut{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:800;font-size:16px;margin:26px 0 4px}
.ut::before,.ut::after{content:"";flex:1;height:2px;background:var(--line)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:44px}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:0;background:var(--c);box-shadow:0 7px 0 var(--cd);
  transform:translateX(var(--x));display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}
.node .pic{font-size:34px}
.node:active{transform:translateX(var(--x)) translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node.locked{background:#e5e5e5;box-shadow:0 7px 0 #cecece}
.node.locked .pic{filter:grayscale(1);opacity:.45}
.node.locked.open .pic{filter:grayscale(.6);opacity:.7}
.node.done::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;
  background:#ffc800;color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.node.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--c);opacity:.35;animation:ring 1.6s infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.5}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
.bub{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:#fff;color:var(--c);
  border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-style:normal;font-weight:900;font-size:16px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite}
.bub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
.allclear{text-align:center;margin:40px 0;color:var(--muted);font-weight:800}
.allclear .pic{font-size:64px;display:block}
.shake{animation:shake .35s}
@keyframes shake{25%{translate:-6px 0}50%{translate:6px 0}75%{translate:-4px 0}}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-weight:700;
  padding:12px 20px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 课程 ---------- */
.lhead{width:100%;max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.x{border:0;background:none;padding:4px;display:flex}
.x svg{width:28px;height:28px;stroke:var(--faint);stroke-width:3;stroke-linecap:round}
.bar{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:8px;transition:width .4s;
  background-image:linear-gradient(transparent 3px,rgba(255,255,255,.3) 3px,rgba(255,255,255,.3) 6px,transparent 6px)}
.combo{font-weight:900;color:#ff9600;font-size:16px;min-width:46px;text-align:right;white-space:nowrap}
.lbody{flex:1;width:100%;max-width:640px;margin:0 auto;padding:6px 16px 16px;display:flex;flex-direction:column}
.lbody h2{font-size:22px;margin:6px 0 12px;font-weight:800}
.say{display:flex;align-items:center;gap:12px;margin-bottom:18px;min-height:64px}
.spk{flex:none;width:64px;height:64px;border-radius:18px;border:0;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);display:flex;align-items:center;justify-content:center}
.spk svg{width:34px;height:34px;fill:#fff}
.spk:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.spk.slow{width:48px;height:48px;border-radius:14px;font-size:24px;font-family:var(--emoji)}
.talk .spk:not(.slow) svg{animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.sent{font-size:24px;font-weight:700;line-height:1.3;border:2px solid var(--line);border-radius:14px;padding:10px 14px;position:relative;cursor:pointer}
.sent.hide{color:var(--faint);font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:calc(100vh - 390px);max-width:calc(100dvh - 390px);min-width:min(100%,300px);margin:0 auto}
.opt{container-type:inline-size}
.opt .pic.nw{white-space:nowrap}
@supports (font-size:1cqw){.opt .pic{font-size:calc(var(--q) * 1cqw)!important}}
.opt{position:relative;aspect-ratio:1/1;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;background:#fff;
  display:flex;align-items:center;justify-content:center;padding:10px;transition:background .1s,border-color .1s,transform .08s}
.opt:active{transform:translateY(2px)}
.n{position:absolute;top:8px;left:10px;font-size:12px;font-weight:800;color:var(--faint);border:2px solid var(--line);border-radius:7px;padding:0 5px;line-height:18px}
.opt.sel,.topt.sel,.chip-w.sel{border-color:#84d8ff;background:var(--blue-bg)}
.opt.sel .n,.topt.sel .n{border-color:#84d8ff;color:var(--blue)}
.opt.right,.topt.right,.chip-w.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong,.topt.wrong,.chip-w.wrong{border-color:var(--red);background:var(--red-bg)}
/* 代码绘制的场景 / 本地图片 */
.scene{display:block;border-radius:12px}
.scene text{font-family:var(--emoji)}
.opt .scene,.opt .pimg{width:100%;height:100%}
.card .scene,.card .pimg{width:min(60vw,280px);height:min(60vw,280px)}
.bigpic .scene,.bigpic .pimg{width:180px;height:180px}
.pimg{display:block;object-fit:contain;border-radius:12px}
mark{background:#fff3b0;color:inherit;border-radius:6px;padding:0 4px}
/* 选词填空 */
.fsent{font-size:26px;font-weight:700;line-height:1.7;margin:6px 0 24px;text-align:center}
.blank{display:inline-block;min-width:96px;border-bottom:3px solid var(--ink);margin:0 6px;color:var(--blue);text-align:center;line-height:1.2}
.blank.ok{color:var(--green-d);border-color:var(--green)}
.blank.no{color:var(--red-d);border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip-w,.wt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;font-weight:700}
.chip-w{padding:12px 22px;font-size:22px}
/* 连词成句 */
.ans{min-height:126px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;margin-bottom:22px;
  background:repeating-linear-gradient(transparent 0 57px,var(--line) 57px 59px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wt{padding:9px 14px;font-size:20px;line-height:1.3}
.wt.used{background:var(--line);color:transparent;border-color:var(--line)}
.ans.right .wt{border-color:var(--green);background:var(--green-bg)}
.ans.wrong .wt{border-color:var(--red);background:var(--red-bg)}
.opt.right{animation:hop .4s}
.opt.wrong,.topt.wrong,.chip-w.wrong,.ans.wrong{animation:shake .4s}
.foot.bad{animation:flash .5s}
@keyframes flash{0%{background:#ff9ea0}100%{background:var(--red-bg)}}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:100%}
.rcard{border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;background:#fff;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.rcard .scene,.rcard .pimg{width:100%;height:auto;aspect-ratio:1/1}
.rcard b{font-size:19px;line-height:1.25}
.rcard small{color:var(--muted);font-size:14px}
.rcard:active{transform:translateY(2px)}
.rcard.talking{border-color:#84d8ff;background:var(--blue-bg)}
@keyframes hop{40%{transform:scale(1.06)}}
.bigpic{display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px;min-height:150px}
.tlist{display:flex;flex-direction:column;gap:10px}
.topt{position:relative;text-align:left;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:#fff;padding:14px 16px 14px 46px;font-size:19px;font-weight:700;line-height:1.3}
.topt .n{top:50%;left:12px;transform:translateY(-50%)}
.badge{align-self:flex-start;background:#f3e3ff;color:#a560e8;font-weight:900;font-size:14px;padding:6px 12px;border-radius:10px;margin:6px 0 10px}
.teach{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.teach .card{border:2px solid var(--line);border-bottom-width:5px;border-radius:26px;padding:24px 34px;min-width:min(100%,280px)}
.teach .ttext{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:800}
.teach .zh{font-size:18px;color:var(--muted)}
.foot{border-top:2px solid var(--line);padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));transition:background .15s}
.foot.ok{background:var(--green-bg);border-color:transparent}
.foot.bad{background:var(--red-bg);border-color:transparent}
.fin{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.fb{display:none;align-items:center;gap:12px}
.foot.ok .fb,.foot.bad .fb{display:flex}
.fb .face{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-family:var(--emoji)}
.fb b{display:block;font-size:24px;font-weight:900}
.fb p{margin:2px 0 0;font-size:16px;font-weight:700}
.fb p span{font-weight:500;opacity:.8}
.foot.ok .fb{color:var(--green-d)}
.foot.bad .fb{color:var(--red-d)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:19px;font-weight:900;letter-spacing:1px;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:var(--line);color:var(--faint);box-shadow:0 5px 0 #d0d0d0;cursor:default;transform:none}
.foot.bad .btn{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* Amazing 弹出 */
.pop{position:fixed;left:50%;top:36%;z-index:40;pointer-events:none;transform:translate(-50%,-50%);font-size:min(14vw,68px);font-weight:900;
  color:#fff;-webkit-text-stroke:3px var(--green-d);paint-order:stroke fill;text-shadow:0 6px 0 var(--green-d);animation:popin 1.1s forwards;white-space:nowrap}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}
  40%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.conf{position:fixed;left:50%;top:36%;z-index:39;pointer-events:none;font-size:30px;font-family:var(--emoji);animation:fly 1s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}}

/* 完成页 */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px}
.done .hero{font-size:110px;font-family:var(--emoji);animation:hop 1s infinite}
.done h1{font-size:30px;margin:8px 0 4px;color:#ffc800;font-weight:900}
.done .lvup{font-size:18px;font-weight:800;color:var(--blue);margin:4px 0}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0 18px;font-family:var(--emoji)}
.stars .off{filter:grayscale(1);opacity:.3}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tile{width:130px;border:2px solid var(--tc);border-radius:16px;overflow:hidden;background:var(--tc)}
.tile b{display:block;color:#fff;font-size:13px;padding:4px 0}
.tile span{display:block;background:#fff;color:var(--tc);font-size:24px;font-weight:900;padding:12px 0;border-radius:13px}

/* 弹窗 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:22px;padding:22px 20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;-webkit-user-select:none}
.sheet h3{margin:0 0 14px;font-size:22px;font-weight:900}
.sheet p{color:var(--muted);line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--soft);font-weight:700}
.row small{display:block;color:var(--faint);font-weight:500;font-size:13px;margin-top:2px}
.row select{font:inherit;font-size:15px;padding:8px;border-radius:10px;border:2px solid var(--line);background:#fff;max-width:200px}
.row input[type=range]{width:150px;accent-color:var(--blue)}
.sw{position:relative;flex:none;width:52px;height:30px;border-radius:15px;background:var(--line);border:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on::after{left:25px}
.btns{display:flex;gap:10px;margin-top:18px}
.btns .btn{font-size:17px;padding:13px}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.ver{text-align:center;color:var(--faint);font-size:12px;margin-top:14px}

@media (max-width:420px){
  .lbody h2{font-size:19px}
  .sent{font-size:20px}
  .teach .ttext{font-size:24px}
  .grid{gap:10px}
}
</style>
</head>
<body>

<!-- 首页：学习路径 -->
<section class="screen on" id="home">
  <header class="top"><div class="top-in">
    <div class="logo"><span class="pic">🐼</span>熊猫英语</div>
    <div class="chip fire" id="hFire">🔥 <span>0</span></div>
    <div class="chip xp" id="hXp">⭐ <span>0</span></div>
    <button class="icon-btn" id="hSet" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div></header>
  <main class="path" id="path"></main>
</section>

<!-- 课程 -->
<section class="screen" id="lesson">
  <div class="lhead">
    <button class="x" id="lQuit" aria-label="退出"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="bar"><i id="lBar"></i></div>
    <div class="combo" id="lCombo"></div>
  </div>
  <div class="lbody" id="lBody"></div>
  <div class="foot" id="lFoot"><div class="fin">
    <div class="fb" id="lFb"></div>
    <button class="btn" id="lMain" disabled>检查</button>
  </div></div>
</section>

<!-- 完成 -->
<section class="screen" id="finish">
  <div class="done" id="fBody"></div>
  <div class="foot"><div class="fin"><button class="btn" id="fNext">继续</button></div></div>
</section>

<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const VERSION='1.3';
const KEY='panda-english-v1';

/* ================= 课程内容 =================
   每行：英文 | 图片(emoji) | 中文
   级别参照 RAZ：aa 单词 → A 短语 → B 句型 → C 描述 → D 进行时 → E 日常 → F 季节/过去式 → G 长句
   每个单元同一句型，选项来自同单元，孩子要听清关键词才能选对。
   图片三种写法：emoji；“#背景 物体@x,y,大小[,f翻转] …”代码绘制场景（[table] 这类是画出来的道具）；“img:文件名”读 images 文件夹
   英文里的 [对/错/错] 是选词填空：第一个是正确答案 */
const U=(name,icon,src)=>({name,icon,items:src.trim().split('\n').map(l=>{
  const [raw,pic,zh]=l.split('|').map(s=>s.trim()),it={text:raw,pic:pic||'-',zh:zh||''};
  const m=raw.match(/\[([^\]]+)\]/);
  if(m){const o=m[1].split('/');it.text=raw.replace(m[0],o[0]);it.blank={answer:o[0],opts:o,pre:raw.slice(0,m.index),post:raw.slice(m.index+m[0].length)}}
  return it;
})});
const LEVELS=[
{id:'aa',name:'AA',title:'第一批单词',c:'#58cc02',cd:'#58a700',units:[
U('动物 Animals','🐾',`
cat|🐱|猫

const ALL=[],UNITS=[];
function chunk(a){const r=[];for(let i=0;i<a.length;i+=3)r.push(a.slice(i,i+3));if(r.length>1&&r[r.length-1].length<2){const l=r.pop();r[r.length-1]=r[r.length-1].concat(l)}return r}
LEVELS.forEach((lv,li)=>lv.units.forEach((u,ui)=>{
  u.li=li;u.ui=ui;u.key=lv.id+'.'+ui;u.gi=UNITS.length;u.level=lv;
  u.items.forEach(it=>{it.id=lv.id+'|'+it.text;it.unit=u;ALL.push(it)});
  u.chunks=chunk(u.items);u.nL=u.chunks.length+1;   // 若干新课 + 1 节复习课
  UNITS.push(u);
}));

const sceneParts=pic=>pic.slice(1).trim().split(/\s+/);
function sceneSVG(pic){
  const tk=sceneParts(pic),bg=BG[tk[0]]!=null?BG[tk.shift()]:BG.none;
  let g='';
  for(const t of tk){
    const at=t.lastIndexOf('@');if(at<0)continue;
    const what=t.slice(0,at),a=t.slice(at+1).split(','),x=+a[0],y=+a[1],s=+a[2];
    const m=what.match(/^\[(\w+)\]$/);
    if(m){if(PROP[m[1]])g+=PROP[m[1]](x,y,s);continue}
    const flip=a.slice(3).includes('f')?` transform="translate(${2*x} 0) scale(-1 1)"`:'';
    g+=`<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="central"${flip}>${what}</text>`;
  }
  return `<svg class="scene" viewBox="0 0 100 100" aria-hidden="true">${bg}${g}</svg>`;
}
const hasPic=it=>!!it.pic&&it.pic!=='-';
function iconOf(pic){
  if(pic[0]==='#'){const e=sceneParts(pic).find(t=>t.includes('@')&&t[0]!=='[');return e?e.slice(0,e.lastIndexOf('@')):'🎨'}
  if(pic.startsWith('img:'))return '🖼️';
  if(pic==='-')return '🔤';
  return graphemes(pic).pop();
}
function picHTML(pic,vw,px){
  if(pic[0]==='#')return sceneSVG(pic);
  if(pic.startsWith('img:'))return `<img class="pimg" src="images/${encodeURIComponent(pic.slice(4))}" alt="" draggable="false">`;
  const n=Math.min(graphemes(pic).length,6),f=[1,1.5,2,2.6,3.2,3.7][n-1];
  // --q：在选项卡片里按卡片宽度缩放（cqw），老浏览器退回 vw/px
  return `<span class="pic${n<=3?' nw':''}" style="font-size:min(${(vw/f).toFixed(1)}vw,${Math.round(px/f)}px);--q:${(50/f).toFixed(1)}">${pic}</span>`;
}

function wav(notes,dur){
  const SR=22050,n=Math.ceil(SR*dur),d=new Float32Array(n);
  for(const [f,st,len,vol,w,f2] of notes){
    const s0=st*SR|0,L=len*SR|0;let ph=0;
    for(let i=0;i<L&&s0+i<n;i++){
      ph+=(f2?f+(f2-f)*i/L:f)/SR;const x=ph%1;
      const v=w==='sq'?(x<.5?.6:-.6):w==='tri'?4*Math.abs(x-.5)-1:Math.sin(2*Math.PI*ph);
      d[s0+i]+=v*vol*Math.min(1,i/(SR*.008))*Math.pow(1-i/L,1.5);
    }
  }
  const buf=new ArrayBuffer(44+n*2),dv=new DataView(buf),ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');dv.setUint32(4,36+n*2,true);ws(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true);dv.setUint32(28,SR*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)dv.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]))*32767,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

// 复习权重：错得多、连对少、隔得久的更容易被抽到
function weight(it){const s=S.stats[it.id];if(!s)return 0;const days=(Date.now()-s.t)/864e5;return (1+s.w*2)/(1+s.k)*(1+Math.min(days,7))}
function pickReview(n,exU){
  let pool=ALL.filter(it=>it.unit!==exU&&S.stats[it.id]).map(it=>({it,w:weight(it)*(it.unit.li===exU.li?1.6:1)}));
  const out=[];
  while(out.length<n&&pool.length){
    let r=Math.random()*pool.reduce((a,b)=>a+b.w,0),i=0;
    for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break}
    out.push(pool[i].it);pool.splice(i,1);
  }
  return out;
}
function distract(it,needPic){
  const ok=x=>x!==it&&x.text!==it.text&&(!needPic||(hasPic(x)&&x.pic!==it.pic));
  let out=shuffle(it.unit.items.filter(ok)).slice(0,3);
  if(out.length<3){
    const more=shuffle(ALL.filter(x=>ok(x)&&x.unit.li===it.unit.li&&!out.includes(x)));
    out=out.concat(more.slice(0,3-out.length));
  }
  return out;
}
/* 题型：listen 听音选图 · read 看图选句 · hear 听音选句（没图的词）· fill 选词填空 · order 连词成句
   新内容先用最简单的题型，复习时按级别混入更难的题型 */
const isSent=it=>/[.!?]$/.test(it.text);
function qType(it,fresh){
  if(fresh)return it.blank?'fill':hasPic(it)?'listen':'hear';
  const n=it.text.split(' ').length,c=[[hasPic(it)?'listen':'hear',5]];
  if(hasPic(it)&&it.unit.li>=1)c.push(['read',2]);
  if(it.blank)c.push(['fill',4]);
  if(it.unit.li>=2&&isSent(it)&&n>=3&&n<=10)c.push(['order',2]);
  let r=Math.random()*c.reduce((a,b)=>a+b[1],0);
  for(const [t,w] of c)if((r-=w)<=0)return t;
  return c[0][0];
}
const firstQ=it=>hasPic(it)?'listen':'hear';
function mkQ(t,it){
  if(t==='teach')return {t,it};
  if(t==='fill')return {t,it,opts:shuffle(it.blank.opts)};
  if(t==='order'){
    const w=it.text.split(/\s+/).map(x=>x.replace(/[.,!?]+$/,''));let o,g=0;
    do{o=shuffle(w.map((_,i)=>i))}while(++g<20&&w.length>1&&o.every((v,i)=>w[v]===w[i]));
    return {t,it,w,bank:o,placed:[]};
  }
  return {t,it,opts:shuffle([it].concat(distract(it,t==='listen')))};
}
function buildLesson(u,k){
  const head=[];let tail=[];
  if(k<u.chunks.length){
    const fresh=u.chunks[k];
    if(S.set.group){
      // 先学后考：连着学完这几个新词 → “认一认”总览 → 再集中考
      fresh.forEach((it,n)=>head.push({t:'teach',it,n:n+1,of:fresh.length}));
      head.push({t:'recap',it:fresh[0],items:fresh});
      shuffle(fresh).forEach(it=>head.push(mkQ(firstQ(it),it)));
    }else fresh.forEach(it=>{head.push(mkQ('teach',it));head.push(mkQ(firstQ(it),it))});
    fresh.forEach(it=>tail.push(mkQ(qType(it,true),it)));
    shuffle(u.chunks.slice(0,k).flat()).slice(0,2).forEach(it=>tail.push(mkQ(qType(it),it)));
    pickReview(2,u).forEach(it=>tail.push(mkQ(qType(it),it)));
  }else{
    u.items.forEach(it=>tail.push(mkQ(qType(it),it)));
    pickReview(3,u).forEach(it=>tail.push(mkQ(qType(it),it)));
  }
  tail=shuffle(tail);
  for(let i=1;i<tail.length;i++)if(tail[i].it===tail[i-1].it&&i+1<tail.length){[tail[i],tail[i+1]]=[tail[i+1],tail[i]]}
  if(head.length&&tail.length>1&&tail[0].it===head[head.length-1].it)[tail[0],tail[1]]=[tail[1],tail[0]];
  return head.concat(tail);
}

});
$('#lQuit').addEventListener('click',()=>{
  modal(`<h3>要退出这节课吗？</h3><p>退出后这节课的进度不会保存哦。</p>
    <div class="btns"><button class="btn ghost" data-close>继续学习</button><button class="btn red" id="mQuit">退出</button></div>`);
  $('#mQuit').onclick=()=>{closeModal();stopSpeak();LS=null;renderHome()};
});
function finish(){
  const n=LS.ok+LS.bad,acc=n?Math.round(LS.ok/n*100):100;
  const xp=10+LS.ok;S.xp+=xp;
  const key=LS.u.key;if((S.done[key]||0)<=LS.k)S.done[key]=LS.k+1;
  const t=today(),y=new Date();y.setDate(y.getDate()-1);
  if(S.last!==t){S.streak=S.last===today(y)?S.streak+1:1;S.last=t}
  save();
  const nc=curGi(),before=LS.cur>=0?UNITS[LS.cur].li:-1,after=nc>=0?UNITS[nc].li:LEVELS.length;
  const lvup=after>before&&before>=0;
  const stars=acc>=90?3:acc>=70?2:1;
  $('#lBar').style.width='100%';
  sfx('win');speak(lvup?'Level up! You are amazing!':'Great job!');
  $('#fBody').innerHTML=`<div class="hero">${lvup?'🏆':'🐼'}</div>
    <h1>${lvup?'升级啦！':'课程完成！'}</h1>
    ${lvup?`<div class="lvup">${after<LEVELS.length?'解锁 LEVEL '+LEVELS[after].name+' · '+LEVELS[after].title:'所有级别都完成了！'}</div>`:''}
    <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">⭐</span>`).join('')}</div>
    <div class="tiles">
      <div class="tile" style="--tc:#ffc800"><b>获得经验</b><span>⭐ +${xp}</span></div>
      <div class="tile" style="--tc:#58cc02"><b>正确率</b><span>🎯 ${acc}%</span></div>
      <div class="tile" style="--tc:#ff9600"><b>最多连对</b><span>🔥 ${LS.best}</span></div>
    </div>`;
  LS=null;show('finish');
}
$('#fNext').addEventListener('click',()=>{stopSpeak();renderHome()});

/* 键盘：1-4 选择，回车 检查/继续，空格 重听 */
document.addEventListener('keydown',e=>{
  if($('#modal').classList.contains('on')){if(e.key==='Escape')closeModal();return}
  if($('#finish').classList.contains('on')&&e.key==='Enter'){$('#fNext').click();return}
  if(!LS||!$('#lesson').classList.contains('on'))return;
  if(e.key>='1'&&e.key<='4')select(+e.key-1);
  else if(e.key==='Enter'){e.preventDefault();$('#lMain').click()}
  else if(e.key===' '){e.preventDefault();const q=LS.q[LS.i];if(q.t!=='read'||LS.ans)speak(q.it.text)}
});

/* ================= 弹窗 / 设置 ================= */
function modal(html){const m=$('#modal');m.innerHTML=`<div class="sheet">${html}</div>`;m.classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});

function openSettings(){
  loadVoices();
  const vopts=VOICES.map(v=>`<option value="${esc(v.voiceURI)}"${voice&&v.voiceURI===voice.voiceURI?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  modal(`<h3>⚙️ 设置</h3>
    <div class="row"><div>朗读方式<small>${VOICES.length?'这台设备有 '+VOICES.length+' 个英文语音':'这台设备没有英文语音，会用在线朗读'}${deviceBad?'（设备语音没反应，已切到在线）':''}</small></div>
      <select id="sEngine"><option value="auto">自动</option><option value="device">设备语音</option><option value="online">在线朗读（需联网）</option></select></div>
    <div class="row"><div>设备语音<small>iPad 推荐 Samantha</small></div><select id="sVoice">${vopts||'<option>（没有找到英文语音）</option>'}</select></div>
    <div class="row"><div>语速<small id="sRateV">${S.set.rate.toFixed(2)}</small></div><input type="range" id="sRate" min="0.55" max="1.1" step="0.05" value="${S.set.rate}"></div>
    <div class="row"><div>题目显示英文<small>关掉就是纯听力练习</small></div><button class="sw${S.set.text?' on':''}" data-k="text"></button></div>
    <div class="row"><div>先学后考<small>开：先连着学完新词再集中考；关：学一个考一个</small></div><button class="sw${S.set.group?' on':''}" data-k="group"></button></div>
    <div class="row"><div>音效</div><button class="sw${S.set.sfx?' on':''}" data-k="sfx"></button></div>
    <div class="row"><div>家长模式：解锁全部<small>可以点任意一课</small></div><button class="sw${S.set.all?' on':''}" data-k="all"></button></div>
    <div class="row"><div>从某个级别开始<small>前面的级别会标记为已完成</small></div><select id="sJump">${LEVELS.map((l,i)=>`<option value="${i}">LEVEL ${l.name}</option>`).join('')}</select></div>
    <div class="btns"><button class="btn ghost" id="sTest">🔊 试听</button><button class="btn ghost" id="sJumpGo">跳到该级别</button></div>
    <div class="btns"><button class="btn red" id="sReset">重置所有进度</button><button class="btn" data-close>完成</button></div>
    <div class="ver">熊猫英语 v${VERSION} · 进度保存在这台设备的浏览器里</div>`);
  $('#sEngine').value=S.set.engine;
  $('#sEngine').onchange=e=>{S.set.engine=e.target.value;deviceBad=false;save();speak('Hello! Let\'s learn English.')};
  $('#sVoice').onchange=e=>{S.set.voice=e.target.value;save();loadVoices();speak('Hello! Let\'s learn English.')};
  $('#sRate').oninput=e=>{S.set.rate=+e.target.value;$('#sRateV').textContent=S.set.rate.toFixed(2);save()};
  $('#sRate').onchange=()=>speak('I like apples.');
  document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.set[k]=!S.set[k];b.classList.toggle('on',S.set[k]);save();if(k==='all')renderHome()});
  $('#sTest').onclick=()=>{actx();speak('Hello! I see a cat. Amazing!')};
  $('#sJumpGo').onclick=()=>{
    const li=+$('#sJump').value;
    UNITS.forEach(u=>{if(u.li<li)S.done[u.key]=u.nL});
    save();closeModal();renderHome();toast('已跳到 LEVEL '+LEVELS[li].name);
  };
  let armed=false;
  $('#sReset').onclick=e=>{
    if(!armed){armed=true;e.target.textContent='再点一次确认';return}
    const set=S.set;S=Object.assign({},DEF,{done:{},stats:{},set});save();closeModal();renderHome();toast('进度已重置');
  };
}
$('#hSet').addEventListener('click',openSettings);

renderHome();
window.__E={S,LEVELS,UNITS,ALL,buildLesson,startLesson};
</script>
</body>
